blueprint:
  name: Grid Power Monitor (blackout / brownout / overvoltage)
  author: Martin Groeneveld
  source_url: https://raw.githubusercontent.com/groveld/home-assistant/refs/heads/main/homeassistant/blueprints/automation/grid_power_monitor.yaml
  description: |
    Monitors a DSMR / P1 smart meter for grid problems and sends notifications for:

    - **Brownout**: voltage below the low threshold
    - **Overvoltage**: voltage above the high threshold
    - **Blackout**: the selected meter sensor becomes unavailable (the P1 reader loses power)
    - **Recovery**: voltage back to normal / power restored (with duration)
    - **Voltage sag / swell counters** increasing (catches short events)
    - **Power failure counters** increasing (meter confirms an outage)
    - **Manual Run** evaluates the current sensor state and reports an active brownout,
      overvoltage, or blackout immediately

    Default thresholds follow EN 50160: 230 V ±10% = 207-253 V.
  domain: automation
  input:
    voltage_sensors:
      name: Meter sensor(s) (availability) / voltage sensor(s)
      description: >
        Select one or more smart-meter sensors (for example Voltage Phase 1/2/3). If your selected
        sensors provide numeric voltage values, brownout/overvoltage checks are applied. If they do
        not, blackout/restored detection still works based on availability.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    low_voltage:
      name: Low voltage threshold (brownout)
      description: Only used when the selected sensor reports a numeric voltage value.
      default: 207
      selector:
        number:
          min: 100
          max: 230
          step: 1
          unit_of_measurement: V
          mode: box
    high_voltage:
      name: High voltage threshold (overvoltage)
      description: Only used when the selected sensor reports a numeric voltage value.
      default: 253
      selector:
        number:
          min: 230
          max: 300
          step: 1
          unit_of_measurement: V
          mode: box
    brownout_delay:
      name: Brownout / overvoltage delay
      description: How long the voltage must stay out of range before notifying. Keep it short.
      default:
        seconds: 3
      selector:
        duration:
    blackout_delay:
      name: Blackout delay
      description: >
        How long the voltage sensor must be unavailable before it counts as a blackout.
        Prevents false alarms from Wi-Fi hiccups of the P1 reader.
      default:
        seconds: 30
      selector:
        duration:
    sag_counters:
      name: Voltage sag counters (optional)
      description: e.g. "Voltage Sags Phase 1"
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    swell_counters:
      name: Voltage swell counters (optional)
      description: e.g. "Voltage Swells Phase 1"
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    failure_counters:
      name: Power failure counters (optional)
      description: e.g. "Electricity Failures" and "Electricity Long Failures"
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    notify_targets:
      name: Notify target(s)
      description: Select one or more notify targets. Leave empty to disable.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: notify
    critical:
      name: Critical outage notifications
      description: >
        Blackout, brownout and overvoltage alerts bypass silent / Do Not Disturb
        mode (iOS critical alert, Android alarm stream).
      default: true
      selector:
        boolean:
    critical_ok:
      name: Critical normal/restored notifications
      description: >
        If enabled, "Voltage back to normal" and "Power restored" notifications also
        bypass silent / Do Not Disturb mode.
      default: false
      selector:
        boolean:
    persistent:
      name: Also create a persistent notification in Home Assistant
      default: true
      selector:
        boolean:
    notify_on_restore:
      name: Notify when power / voltage is back to normal
      default: true
      selector:
        boolean:

mode: queued
max: 10

triggers:
  - trigger: numeric_state
    entity_id: !input voltage_sensors
    below: !input low_voltage
    for: !input brownout_delay
    id: brownout
  - trigger: numeric_state
    entity_id: !input voltage_sensors
    above: !input high_voltage
    for: !input brownout_delay
    id: overvoltage
  - trigger: numeric_state
    entity_id: !input voltage_sensors
    above: !input low_voltage
    below: !input high_voltage
    for:
      seconds: 30
    id: normal
  - trigger: state
    entity_id: !input voltage_sensors
    to: ["unavailable", "unknown"]
    for: !input blackout_delay
    id: blackout
  - trigger: state
    entity_id: !input voltage_sensors
    from: ["unavailable", "unknown"]
    not_to: ["unavailable", "unknown"]
    id: restored
  - trigger: state
    entity_id: !input sag_counters
    id: sag
  - trigger: state
    entity_id: !input swell_counters
    id: swell
  - trigger: state
    entity_id: !input failure_counters
    id: failure

variables:
  voltage_sensors: !input voltage_sensors
  low: !input low_voltage
  high: !input high_voltage
  blackout_delay: !input blackout_delay
  notify_targets: !input notify_targets
  critical: !input critical
  critical_ok: !input critical_ok
  persistent: !input persistent
  notify_on_restore: !input notify_on_restore
  sensor_entities: "{{ expand(voltage_sensors) }}"
  unavailable_count: "{{ sensor_entities | selectattr('state', 'in', ['unavailable', 'unknown']) | list | count }}"
  any_unavailable: "{{ unavailable_count | int > 0 }}"
  numeric_values: "{{ sensor_entities | map(attribute='state') | select('is_number') | map('float') | list }}"
  numeric_count: "{{ numeric_values | count }}"
  min_voltage: "{{ (numeric_values | min) if (numeric_count | int > 0) else none }}"
  max_voltage: "{{ (numeric_values | max) if (numeric_count | int > 0) else none }}"
  event: >
    {% if trigger is defined and trigger is not none and trigger.id is defined %}
      {{ trigger.id }}
    {% elif any_unavailable %}
      blackout
    {% elif min_voltage is not none and min_voltage < low %}
      brownout
    {% elif max_voltage is not none and max_voltage > high %}
      overvoltage
    {% else %}
      manual
    {% endif %}
  voltage: >
    {% set to_state = (trigger | default({})).get('to_state') %}
    {% if to_state is not none and to_state.state | is_number %}
      {{ to_state.state | float | round(0) }}
    {% elif event == 'brownout' and min_voltage is not none %}
      {{ min_voltage | round(0) }}
    {% elif event == 'overvoltage' and max_voltage is not none %}
      {{ max_voltage | round(0) }}
    {% else %}
      unknown
    {% endif %}
  blackout_s: >
    {{ (blackout_delay.hours | default(0)) * 3600
       + (blackout_delay.minutes | default(0)) * 60
       + (blackout_delay.seconds | default(0)) }}
  outage_s: >
    {% set from_state = (trigger | default({})).get('from_state') %}
    {% if from_state is not none %}
      {{ (now() - from_state.last_changed).total_seconds() | int }}
    {% else %}0{% endif %}
  duration: >
    {% set s = outage_s | int %}
    {{ '%d:%02d:%02d' % (s // 3600, (s % 3600) // 60, s % 60) }}
  entity_name: >
    {% set entity_id = (trigger | default({})).get('entity_id') %}
    {{ state_attr(entity_id, 'friendly_name') or (entity_id if entity_id is not none else 'unknown entity') }}
  should_notify: >
    {% set from_state = (trigger | default({})).get('from_state') %}
    {% set to_state = (trigger | default({})).get('to_state') %}
    {% if event in ['brownout', 'overvoltage', 'blackout'] %}
      true
    {% elif event == 'normal' %}
      {{ notify_on_restore and from_state is not none and from_state.state | is_number and
         (from_state.state | float < low or from_state.state | float > high) }}
    {% elif event == 'restored' %}
      {{ notify_on_restore and outage_s | int >= blackout_s | int }}
    {% elif event in ['sag', 'swell', 'failure'] %}
      {{ from_state is not none and to_state is not none and from_state.state | is_number and to_state.state | is_number and to_state.state | float > from_state.state | float }}
    {% else %}
      false
    {% endif %}
  title: >
    {% set titles = {
      'brownout': '⚠️ Brownout detected',
      'overvoltage': '⚠️ Overvoltage detected',
      'blackout': '🔴 Power outage',
      'normal': '✅ Voltage back to normal',
      'restored': '✅ Power restored',
      'sag': '⚡ Voltage sag registered',
      'swell': '⚡ Voltage swell registered',
      'failure': '⚡ Power failure registered'
    } %}
    {{ titles.get(event, 'Grid monitor') }}
  message: >
    {% set t = now().strftime('%H:%M:%S') %}
    {% set trigger_data = trigger | default({}) %}
    {% set from_state = trigger_data.get('from_state') %}
    {% set to_state = trigger_data.get('to_state') %}
    {% if event == 'brownout' %}
      Grid voltage dropped to {{ voltage }} V at {{ t }} (limit {{ low }} V). Your UPS may be running on battery.
    {% elif event == 'overvoltage' %}
      Grid voltage rose to {{ voltage }} V at {{ t }} (limit {{ high }} V).
    {% elif event == 'blackout' %}
      The smart meter stopped reporting at {{ t }}. Probable grid outage. Devices are running on UPS battery.
    {% elif event == 'normal' %}
      Voltage is {{ voltage }} V again (was {{ from_state.state if from_state is not none else 'unknown' }} V).
    {% elif event == 'restored' %}
      The meter is reporting again at {{ t }}. Voltage {{ voltage }} V. Outage lasted {{ duration }}.
    {% elif event in ['sag', 'swell', 'failure'] %}
      {{ entity_name }} went from {{ from_state.state if from_state is not none else 'unknown' }} to {{ to_state.state if to_state is not none else 'unknown' }} at {{ t }}. Current voltage {{ voltage }} V.
    {% endif %}
  push_data: >
    {% if (critical and event in ['brownout', 'overvoltage', 'blackout'])
          or (critical_ok and event in ['normal', 'restored']) %}
      {{ {'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
          'ttl': 0, 'priority': 'high', 'channel': 'alarm_stream'} }}
    {% else %}
      {{ {} }}
    {% endif %}

actions:
  - condition: template
    value_template: "{{ should_notify }}"
  - if:
      - condition: template
        value_template: "{{ notify_targets | count > 0 }}"
    then:
      - repeat:
          for_each: "{{ notify_targets }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data: "{{ push_data }}"
  - if:
      - condition: template
        value_template: "{{ persistent }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "grid_monitor_{{ event }}_{{ now().timestamp() | int }}"
          title: "{{ title }}"
          message: "{{ message }}"
