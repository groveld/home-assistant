blueprint:
  name: Philips Hue Wall Module
  author: Martin Groeneveld
  source_url: https://raw.githubusercontent.com/groveld/home-assistant/refs/heads/main/homeassistant/blueprints/automation/philips_hue_wall_module.yaml
  description: >
    This blueprint allows you to use a Philips Hue Wall Module (RDM001 and RDM004)
    to trigger automations in Home Assistant. You need to have the module paired
    to your Home Assistant Zigbee integration (ZHA). You might need to configure
    the module depending on which physical switch is used (single/double and
    rocker/push). See https://zigbee.blakadder.com/Philips_RDM001.html and
    https://community.home-assistant.io/t/how-to-configure-the-philips-hue-wall-module-to-use-push-button-momentary-type-wall-switches-zha/451125/13
    for more information.
  domain: automation
  input:
    remote:
      name: Remote
      description: Signify switch to use
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: RDM001
            - integration: zha
              manufacturer: Signify Netherlands B.V.
              model: RDM004
    left_press:
      name: Left Press
      description: Left press
      default: []
      selector:
        action: null
    left_short_release:
      name: Left Short Release
      description: Left Short Release
      default: []
      selector:
        action: null
    left_double_press:
      name: Left Double Press
      description: Left Double Press
      default: []
      selector:
        action: null
    left_triple_press:
      name: Left Triple Press
      description: Left Triple Press
      default: []
      selector:
        action: null
    left_quadruple_press:
      name: Left Quadruple Press
      description: Left Quadruple Press
      default: []
      selector:
        action: null
    left_quintuple_press:
      name: Left Quintuple Press
      description: Left Quintuple Press
      default: []
      selector:
        action: null
    left_hold:
      name: Left Hold
      description: Left Hold
      default: []
      selector:
        action: null
    left_long_release:
      name: Left Long Release
      description: Left Long Relase
      default: []
      selector:
        action: null
    right_press:
      name: Right Press
      description: Right press
      default: []
      selector:
        action: null
    right_short_release:
      name: Right Short Release
      description: Right Short Release
      default: []
      selector:
        action: null
    right_double_press:
      name: Right Double Press
      description: Right Double Press
      default: []
      selector:
        action: null
    right_triple_press:
      name: Right Triple Press
      description: Right Triple Press
      default: []
      selector:
        action: null
    right_quadruple_press:
      name: Right Quadruple Press
      description: Right Quadruple Press
      default: []
      selector:
        action: null
    right_quintuple_press:
      name: Right Quintuple Press
      description: Right Quintuple Press
      default: []
      selector:
        action: null
    right_hold:
      name: Right Hold
      description: Right Hold
      default: []
      selector:
        action: null
    right_long_release:
      name: Right Long Release
      description: Right Long Relase
      default: []
      selector:
        action: null

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

mode: restart
max_exceeded: silent

action:
  - variables:
      command: "{{ trigger.event.data.command | default('') }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_press' }}"
        sequence: !input left_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_short_release' }}"
        sequence: !input left_short_release
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_double_press' }}"
        sequence: !input left_double_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_triple_press' }}"
        sequence: !input left_triple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_quadruple_press' }}"
        sequence: !input left_quadruple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_quintuple_press' }}"
        sequence: !input left_quintuple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_hold' }}"
        sequence: !input left_hold
      - conditions:
          - condition: template
            value_template: "{{ command == 'left_long_release' }}"
        sequence: !input left_long_release
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_press' }}"
        sequence: !input right_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_short_release' }}"
        sequence: !input right_short_release
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_double_press' }}"
        sequence: !input right_double_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_triple_press' }}"
        sequence: !input right_triple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_quadruple_press' }}"
        sequence: !input right_quadruple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_quintuple_press' }}"
        sequence: !input right_quintuple_press
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_hold' }}"
        sequence: !input right_hold
      - conditions:
          - condition: template
            value_template: "{{ command == 'right_long_release' }}"
        sequence: !input right_long_release
